# Every push and pull request: the checks of the definition of done (AGENTS.md section 7) that need no database and
# no model, through the same script developers run (backend/scripts/check.py). No secrets: nothing here calls Gemini
# or a sign-in provider.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The same .venv a developer has: Pyright's settings (pyproject.toml) look for the packages there.
      - name: Install the Python tools and packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run Python checks
        run: .venv/bin/python backend/scripts/check.py --python

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the web app's packages
        working-directory: web
        run: npm ci

      - name: Run web checks
        run: python3 backend/scripts/check.py --web
